# ~/.config/hypr/hyprland.conf
# Portable, Distro-Agnostic Hyprland Configuration for herabel
# Works out of the box on Arch, EndeavourOS, CachyOS, Fedora, etc.

# ── Monitors ─────────────────────────────────────────────────────
# Auto-detect all connected displays with native resolution & refresh rate
monitor=,preferred,auto,auto

# ── Variables ────────────────────────────────────────────────────
$mod = SUPER
$terminal = kitty
$menu = fuzzel || rofi -show drun || wofi --show drun

# ── Input Configuration ──────────────────────────────────────────
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1
    # Pure 1:1 raw mouse tracking for gaming/precision (zero acceleration)
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# ── General & Appearance ─────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    animation = windows, 1, 3, easeOutCubic, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, easeOutCubic
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1 # Adaptive sync for gaming
}

# ── Keybindings: Core System ─────────────────────────────────────
bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, D, fullscreen, 1
bind = $mod, A, togglefloating
bind = $mod, SPACE, exec, $menu

# Window Focus (Vim-keys & Arrows)
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move Active Window to Workspace 1-9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# ── Audio Controls (Pipewire / wpctl) ─────────────────────────────
binde = $mod, equal, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = $mod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mod, 0, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Discord / Vesktop Global Controls (Hardware Keycodes) ─────────
# Right Ctrl (code:105) -> Toggle Mute (Ctrl + Shift + M)
# Right Shift (code:62) -> Toggle Deafen (Ctrl + Shift + D)
bind = , code:105, sendshortcut, CTRL SHIFT, m, class:^(vesktop|discord)$
bind = , code:62,  sendshortcut, CTRL SHIFT, d, class:^(vesktop|discord)$

# ── Custom Utilities ─────────────────────────────────────────────
# Super + Shift + M -> Save currently playing audio/radio track to file & clipboard
bind = $mod SHIFT, M, exec, ~/.local/bin/save-current-track
